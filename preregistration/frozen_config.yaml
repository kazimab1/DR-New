# VERIFY-DR — frozen configuration
# Filled in from B1-B5 and C1-C4. After committing, this file does not change.
# Deviations go in PREREGISTRATION.md, dated, never by editing this file.
# After committing, this file does not change. Deviations go in PREREGISTRATION.md.

meta:
  frozen_at: 2026-09-16
  frozen_commit: null        # set by the NEXT commit; see PREREGISTRATION.md.
                             # Not by amending -- an amended commit has a
                             # different hash than the one just recorded.
  seeds: [42, 43, 44]
  # Phase 6 at 10 epochs projects to 21.7 GPU-h on 59 842 training rows -- more
  # than one week's 30 h quota allows alongside anything else, so the six runs
  # are executed across sessions by notebooks/06_final_training.ipynb, which
  # checkpoints every epoch, resumes, and refuses to start a run it cannot
  # finish. Splitting the runs across weeks changes no number: the six are
  # independent, and each is seeded.

data:
  cache: verify-dr-cache-512
  image_size: 512           # B1 -- the cache's native size; no trend above noise
  train_variants: [eyepacs_full, eyepacs_ddr_full]
  split: official_eyepacs    # 35,126 train / 53,576 test
  val_fraction: 0.10         # carved from train, patient-grouped
  calibration_fraction: 0.05 # carved from train, patient-grouped
  externals: [aptos, messidor2]   # LOCKED - evaluated once

grading_model:
  backbone: efficientnet_b0  # B2 -- QWK tied with ResNet50 at 0.70x the cost
  pretrained: true
  head: ordinal_focal        # B3 -- CORAL ordinal; softmax_ce ruled out
  focal_gamma: 2.0           # B3 -- +83% grade-1 recall for 0.8x the QWK noise floor
  aux_heads: {rdr: 0.3, vtdr: 0.3}
  eye_pair_fusion: false     # B5 -- best grader, rejected: it confounds disagreement
  dropout: 0.3

training:
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  schedule: cosine
  warmup_epochs: 2
  epochs: 10              # every Stage B result was measured at 10; see D7
  early_stopping: {metric: val_qwk, patience: 3}
  batch_size: 32
  amp: true
  sampler: stratified_exposure  # B4 -- inverse grade frequency

augmentation:
  hflip: 0.5
  vflip: 0.0
  rotation_deg: 15
  brightness_contrast: 0.2
  scale_jitter: 0.1
  channel_shuffle: false     # lesion colour is diagnostic - never enable

evidence_model:
  arch: resnet18_unet
  channels: [microaneurysm, haemorrhage, hard_exudate, soft_exudate]
  # DDR ONLY. The template said [ddr_seg, idrid_seg]; IDRiD is held out so C3 has a
  # genuine external domain, which is worth more to a thesis about generalisation
  # than 81 extra training images. Deviation D2.
  train_sources: [ddr_seg]
  held_out_for_transfer: [idrid_seg]
  loss: {dice: 0.5, bce: 0.5}
  threshold: 0.5
  min_component_area_px: 4   # C2 -- an MA is 10-20 px; 4 is noise, not a finding
  result: {mean_dice_present: 0.5045, microaneurysm_dice: 0.3439}
  transfer: {ddr_to_idrid_dice: 0.4254}   # C3 -- -16% relative, no collapse

geometry:
  arch: resnet18_coord       # coordinate head; the heatmap head was tried and refuted
  targets: [od_x, od_y, fovea_x, fovea_y]
  train_source: idrid_partB  # IDRiD_001-516; Part A is the mask set and is disjoint
  acceptance_error_dd: 0.5   # C1 gate
  # C1 FAILED: 0.686 DD. Recorded, not revised. The consequence is below.
  measured_error_dd: 0.686
  gate_passed: false

reasoner:
  mode: partial_icdr
  unobservable: [venous_beading, irma, neovascularisation]
  abstain_upward: true
  # R4 (the 4-2-1 severe criterion) needs quadrants, which need geometry that passed
  # its gate. It did not, so R4 never fires and grades 3 and 4 are unreachable.
  # docs/00_START_HERE.md names this as the designed fallback. Deviation D1.
  quadrant_rules_enabled: false
  reachable_grades: [0, 1, 2]
  result: {qwk_vs_true_grade: 0.3754, n: 11767}   # C4

calibration:
  temperature_scaling: true
  fit_on: internal_calibration_split
  prior_shift: saerens_decock_em    # uses UNLABELLED target images only

triage:
  gating_arms: [none, confidence, ood_z, disagreement, combined]
  primary_arm: disagreement
  # Not a number yet, and deliberately so: it is fit in Phase 7, on the INTERNAL
  # calibration split only. Freezing the procedure rather than the value is what
  # keeps it honest -- a threshold tuned on target data would make the triage
  # comparison meaningless, and rule 1 forbids it.
  ood_threshold: {fit_on: internal_calibration_split, criterion: fixed_coverage}
  coverage_points: [0.80, 0.90]   # secondary outcomes are read at these
  actions: [ACCEPT, ADJACENT_GRADE_SET, DEFER, REACQUIRE]

counterfactual:
  inpaint: {method: telea, radius: 5}
  control: random_regions_equal_area   # E2 - mandatory
